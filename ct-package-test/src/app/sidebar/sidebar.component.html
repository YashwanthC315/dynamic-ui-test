<aside class="sidebar">
  @for (item of items; track item.code) {
    <div
      class="sidebar-icon"
      [class.active]="item.code === activeCode()"
      [title]="item.label"
      (click)="select(item.code)"
    >
      {{ item.code }}
    </div>
  }
  <div class="sidebar-icon chat-launch" title="AI Agent" (click)="onToggleChat()">AI</div>
</aside>
