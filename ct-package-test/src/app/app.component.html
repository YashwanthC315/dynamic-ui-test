<div class="app-shell">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-badge">CT</span>
      <span class="app-name">CampusTrack</span>
    </div>
    <div class="topbar-right">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="user-chip">{{ userEmail }}</span>
    </div>
  </header>

  <div class="app-body">
    <app-sidebar (toggleChat)="chatOpen = !chatOpen" />

    <div class="acp-workspace">
      <div class="acp-workspace__chat" *ngIf="chatOpen">
        <acp-chat-panel
          dock="left"
          [open]="chatOpen"
          [width]="chatWidth"
          [min-width]="280"
          [max-width]="640"
          [messages]="chatMessages"
          (acp-open-change)="chatOpen = $any($event).detail"
          (acp-width-change)="chatWidth = $any($event).detail"
          (acp-message-sent)="onChatMessage($any($event).detail)"
          (acp-form-requested)="onFormRequested($any($event).detail)"
          (acp-new-chat)="onNewChat()"
          (acp-help)="onChatHelp()"
        ></acp-chat-panel>
      </div>

      <div class="acp-workspace__container">
        <ng-container *ngIf="dynamicForms.length; else hostContent">
          <div class="acp-dynamic-forms" style="display:flex; gap:12px; align-items:flex-start;">
            <acp-dynamic-container
              *ngFor="let form of dynamicForms"
              [open]="form.open"
              [formSpec]="form.spec"
              [attr.form-width]="form.width"
              (acp-open-change)="onFormOpenChange(form.id, $any($event).detail)"
              (acp-submitted)="onDynamicSubmit($any($event).detail)"
              (acp-cancelled)="closeFormById(form.id)"
            ></acp-dynamic-container>
          </div>
        </ng-container>
      </div>

      <ng-template #hostContent>
        <main class="acp-workspace__content">
          <app-dashboard />
        </main>
      </ng-template>
    </div>
  </div>

  <footer class="footer">
    <span><a href="#">Privacy Policy (Web)</a> / <a href="#">Privacy Policy (Mobile App)</a></span>
    <span>CampusTrack 2025</span>
    <span><a href="#">Terms of Service</a></span>
  </footer>
</div>
